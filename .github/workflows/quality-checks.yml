name: Content and calculator regression tests
on:
  pull_request:
  push:
    branches: [main, 'feature/saas-studio-foundation']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m py_compile source/build.py source/editorial_cases.py scripts/rebuild.py
      - run: npm run test:saas
      - run: npm test
